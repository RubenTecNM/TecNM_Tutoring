networks:
  tecnm_network:
    driver: bridge
    name: tecnm_tutoring_network

volumes:
  postgres_data:
    name: tecnm_postgres_data
  uploads_data:
    name: tecnm_uploads_data

services:

  # ── Base de Datos PostgreSQL 18 ──────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: tecnm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tecnm_tutoring}
      POSTGRES_USER: ${POSTGRES_USER:-tecnm_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable POSTGRES_PASSWORD requerida}
    ports:
      - "${DB_PORT:-5439}:5432"
    volumes:
      # Volumen persistente — ruta completa requerida por PostgreSQL
      - postgres_data:/var/lib/postgresql/data
      # Init scripts — se ejecutan en orden lexicográfico (solo en BD nueva)
      - ./docs/database/01_users.sql:/docker-entrypoint-initdb.d/01_users.sql:ro
      - ./docs/database/02_tutoring.sql:/docker-entrypoint-initdb.d/02_tutoring.sql:ro
    networks:
      - tecnm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tecnm_app} -d ${POSTGRES_DB:-tecnm_tutoring}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Backend .NET 10 Web API ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tecnm-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5185
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-tecnm_tutoring};Username=${POSTGRES_USER:-tecnm_app};Password=${POSTGRES_PASSWORD:?Variable POSTGRES_PASSWORD requerida}
      - Jwt__SecretKey=${JWT_SECRET_KEY:?Variable JWT_SECRET_KEY requerida}
    ports:
      - "${BACKEND_PORT:-5185}:5185"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tecnm_network

  # ── Frontend Vue 3 + Nginx ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tecnm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5085}:80"
    depends_on:
      - backend
    networks:
      - tecnm_network